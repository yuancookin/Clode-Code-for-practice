[theme]
base = "light"
primaryColor = "#E04A2C"
backgroundColor = "#DCE6EE"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#1E2A33"
font = "Zen Kaku Gothic New:https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap"
baseRadius = "large"
borderColor = "#C6D4DF"
showWidgetBorder = true

[server]
# static/ のアイコン画像を app/static/... で配信する（ホーム画面用アイコン）
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="プロジェクト・タグ・繰り返し・カンバン・カレンダー・統計に対応した高機能タスク管理アプリ">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ad1457">
<title>TaskFlow — 高機能タスク管理</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>">
</head>
<body>
  <a class="skip-link" href="#view-root">本文へスキップ</a>

  <div class="app-shell">
    <header class="topbar">
      <button type="button" id="btn-menu" class="icon-btn menu-btn" aria-label="サイドバーを開閉" aria-expanded="true">☰</button>

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span class="brand-name">TaskFlow</span>
      </div>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          placeholder="タスクを検索…  ( / )"
          autocomplete="off"
          aria-label="タスクを検索"
        >
        <button type="button" id="search-clear" class="search-clear" aria-label="検索をクリア" hidden>✕</button>
      </div>

      <div class="topbar-actions">
        <div id="pomodoro-widget" class="pomodoro" aria-label="ポモドーロタイマー"></div>
        <button type="button" id="btn-undo" class="icon-btn" aria-label="元に戻す (Ctrl+Z)" title="元に戻す (Ctrl+Z)" disabled>↶</button>
        <button type="button" id="btn-redo" class="icon-btn" aria-label="やり直す (Ctrl+Shift+Z)" title="やり直す (Ctrl+Shift+Z)" disabled>↷</button>
        <button type="button" id="btn-theme" class="icon-btn" aria-label="テーマを切り替え" title="テーマを切り替え">◐</button>
        <button type="button" id="btn-help" class="icon-btn" aria-label="ショートカット一覧 (?)" title="ショートカット一覧 (?)">?</button>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="設定" title="設定">⚙</button>
      </div>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar" aria-label="ビューとプロジェクト"></aside>
      <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>

      <main class="main">
        <div id="toolbar" class="toolbar"></div>

        <form id="quick-add" class="quick-add" autocomplete="off">
          <input
            type="text"
            id="quick-add-input"
            class="quick-add-input"
            placeholder="タスクを追加…  例: 資料をまとめる 明日 15:00 !高 @仕事 #会議 毎週"
            maxlength="500"
            aria-label="タスクを追加"
          >
          <button type="submit" class="btn primary">追加</button>
        </form>
        <div id="quick-add-hint" class="quick-add-hint" hidden></div>

        <div id="view-root" class="view-root" tabindex="-1"></div>

        <footer id="statusbar" class="statusbar"></footer>
      </main>

      <aside id="detail" class="detail" aria-label="タスクの詳細" hidden></aside>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="palette-root"></div>

  <noscript>
    <p style="padding:24px;text-align:center">このアプリを利用するには JavaScript を有効にしてください。</p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
